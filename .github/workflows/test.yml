name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Validate every skill against CONVENTIONS.md
        run: bash tools/validate-skill.sh --all

      - name: Validate the Conductor agent definitions
        run: bash tools/validate-agents.sh

      - name: Run the test suite (optional)
        run: |
          if [ ! -f tests/run-all.sh ]; then
            echo "tests/run-all.sh not present in the repo — skipping."
            exit 0
          fi
          bash tests/run-all.sh

      # Diagnostic, not a gate — `continue-on-error` keeps the step's own
      # red/green signal while letting the job pass.
      #
      # This eval measures how distinguishable the skill descriptions are from
      # one another, which is a property of the whole set rather than of any
      # one skill. With ~23 mutually overlapping descriptions about two land
      # under threshold on any given run, and *which* two moves when an
      # unrelated description is edited — session-continuity shifted 0.83 ->
      # 0.75 on a commit that never touched it, because editing three other
      # descriptions changes the menu every routing decision is made against.
      # Blocking pushes on a number nobody can hold steady trains people to
      # ignore the number.
      #
      # tests/triggering-evals/README.md has said "run it deliberately, not on
      # every commit" and "false positives at this layer are not actionable
      # bugs, they're feedback on how distinguishable a description is" since it
      # was written. The wiring contradicted its own README; this makes them
      # agree. Read the scorecard in the run summary and work the overlap down
      # deliberately.
      - name: Triggering evals (diagnostic — does not gate)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ANTHROPIC_API_KEY secret not set — skipping triggering evals."
            exit 0
          fi
          if [ ! -f tests/triggering-evals/run.sh ]; then
            echo "tests/triggering-evals/run.sh not present yet — skipping."
            exit 0
          fi
          # --mode llm = the real router (haiku). Static keyword overlap is a
          # crude proxy that false-fails on shared words; don't gate on it.
          bash tests/triggering-evals/run.sh --mode llm 2>&1 | tee /tmp/evals.txt
          rc=${PIPESTATUS[0]}
          # Surface the scorecard on the run page — the whole point of a
          # diagnostic is that someone reads it without digging through logs.
          {
            echo '## Skill triggering evals'
            echo
            echo 'Diagnostic only — this step does not gate the build.'
            echo
            echo '```'
            cat /tmp/evals.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
